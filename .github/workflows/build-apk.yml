name: Build LyricSide APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk LyricSide-v2.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LyricSide-v2-APK
          path: LyricSide-v2.apk

      - name: Publish installable release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: LyricSide build ${{ github.run_number }}
          body: |
            APK Android gerado automaticamente.
            Baixe `LyricSide-v2.apk` nos Assets desta release.
          files: LyricSide-v2.apk
          prerelease: true
